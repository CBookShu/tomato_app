name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run release:verify --workspace tomato-app
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run release version tests
        run: npm --workspace tomato-app run test -- --run tests/lib/release-version.test.ts

      - name: Run update service tests
        run: npm --workspace tomato-app run test -- --run tests/main/update/update-service.test.ts

      - name: Run renderer update tests
        run: npm --workspace tomato-app run test -- --run tests/stores/update-store.test.ts tests/components/update-settings.test.tsx

      - name: Build workspace
        run: npm run build

      - name: Build macOS release
        run: npm run dist --workspace tomato-app -- --publish never

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            tomato_app/release/*.dmg
            tomato_app/release/*.zip
