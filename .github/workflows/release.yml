name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run release:verify --workspace tomato-app
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run tests
        run: npm test

      - name: Build workspace
        run: npm run build

      - name: Build macOS release
        run: npm run dist --workspace tomato-app

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            tomato_app/release/*.dmg
            tomato_app/release/*.zip
