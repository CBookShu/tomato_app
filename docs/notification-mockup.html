<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>macOS 通知原型 - Tomato（最终版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }
    .scene {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .scene-title {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    .screen {
      background: #2d2d44;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      min-height: 160px;
      position: relative;
    }
    .screen-label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
    }
    .notification {
      background: rgba(255,255,255,0.98);
      border-radius: 12px;
      padding: 14px 16px;
      width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .notif-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .notif-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .notif-icon.green {
      background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
    }
    .notif-meta { flex: 1; }
    .notif-app {
      font-size: 12px;
      color: #888;
      font-weight: 600;
    }
    .notif-time {
      font-size: 11px;
      color: #aaa;
    }
    .notif-title {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .notif-body {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    .notif-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .notif-btn {
      flex: 1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      border: none;
      transition: all 0.15s;
    }
    .notif-btn:hover {
      transform: translateY(-1px);
    }
    .btn-primary {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: white;
    }
    .btn-primary.green {
      background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }
    .desc {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <h1 style="color: white; font-size: 24px;">🍅 Tomato 通知原型</h1>

  <div class="scene">
    <div class="scene-title">场景 1：番茄时间结束</div>
    <div class="screen">
      <div class="screen-label">屏幕右上角</div>
      <div class="notification">
        <div class="notif-header">
          <div class="notif-icon">🍅</div>
          <div class="notif-meta"><div class="notif-app">Tomato</div></div>
          <div class="notif-time">刚刚</div>
        </div>
        <div class="notif-title">🍅 番茄时间结束</div>
        <div class="notif-body">该休息一下了！你完成了 1 个番茄钟。</div>
        <div class="notif-actions">
          <button class="notif-btn btn-secondary">关闭</button>
          <button class="notif-btn btn-primary">打开应用</button>
        </div>
      </div>
    </div>
  </div>

  <div class="scene">
    <div class="scene-title">场景 2：休息时间结束</div>
    <div class="screen">
      <div class="screen-label">屏幕右上角</div>
      <div class="notification">
        <div class="notif-header">
          <div class="notif-icon green">☕</div>
          <div class="notif-meta"><div class="notif-app">Tomato</div></div>
          <div class="notif-time">刚刚</div>
        </div>
        <div class="notif-title">☕ 休息时间结束</div>
        <div class="notif-body">可以继续专注了！</div>
        <div class="notif-actions">
          <button class="notif-btn btn-secondary">关闭</button>
          <button class="notif-btn btn-primary green">打开应用</button>
        </div>
      </div>
    </div>
  </div>

  <div class="desc">
    <strong>说明：</strong><br>
    • 「关闭」— 仅关闭通知<br>
    • 「打开应用」— 聚焦到应用窗口，用户自行决定下一步<br>
    • 通知 3-5 秒后自动消失
  </div>
</body>
</html>
