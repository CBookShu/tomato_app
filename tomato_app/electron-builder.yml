appId: com.pomodoro.tomato-app
productName: Tomato
copyright: Copyright 2026

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - node_modules/**/*
  - package.json

mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.png
  target:
    - nsis

linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
